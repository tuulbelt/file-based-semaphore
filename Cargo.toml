[package]
name = "file-based-semaphore"
version = "0.1.0"
edition = "2021"
description = "Cross-platform file-based semaphore for process coordination"
license = "MIT"
repository = "https://github.com/tuulbelt/file-based-semaphore"
homepage = "https://tuulbelt.github.io/tuulbelt/tools/file-based-semaphore/"
readme = "README.md"
# Report issues at: https://github.com/tuulbelt/tuulbelt/issues
keywords = ["tuulbelt", "semaphore", "lock", "process", "coordination"]
categories = ["concurrency", "command-line-utilities"]

[lib]
name = "file_based_semaphore"
path = "src/lib.rs"

[[bin]]
name = "sema"
path = "src/main.rs"

[[bin]]
name = "file-semaphore"
path = "src/main.rs"

[dependencies]
# Zero runtime dependencies - uses only std library

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "main"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
